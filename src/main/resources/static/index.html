<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tournament Setup</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0c0f17] text-slate-100 min-h-screen">
<div class="max-w-7xl mx-auto px-4 py-8">
    <header class="flex flex-col sm:flex-row justify-between items-start sm:items-center pb-6 mb-8 border-b border-slate-800 gap-4">
        <div>
            <span class="text-xs font-mono font-semibold tracking-wider text-emerald-400 uppercase bg-emerald-950/50 px-2.5 py-1 rounded border border-emerald-800/50">Chess Swiss System</span>
            <h1 class="text-2xl font-bold text-white mt-1 tracking-tight">Tournament Setup Center</h1>
        </div>
        <div id="backend-sync-status" class="text-xs font-mono bg-blue-950 text-blue-300 px-2.5 py-1.5 rounded border border-blue-800/50">API: Standby</div>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
        <div class="lg:col-span-1 space-y-6">
            <div class="bg-slate-900 border border-slate-800 rounded-lg p-5">
                <h2 class="text-sm font-semibold text-slate-300 uppercase tracking-wider mb-4">1. Configuration</h2>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-2">Total Rounds</label>
                    <input type="number" id="rounds-count" value="3" min="1" max="15" class="w-full bg-slate-950 border border-slate-800 rounded px-3 py-2 text-sm text-white focus:border-emerald-500 focus:outline-none font-mono">
                </div>
            </div>

            <div class="bg-slate-900 border border-slate-800 rounded-lg p-5">
                <h2 class="text-sm font-semibold text-slate-300 uppercase tracking-wider mb-4">2. Add Participant</h2>
                <div class="space-y-3">
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Quick Load</label>
                        <div class="flex gap-2">
                            <input type="number" id="fetch-id" placeholder="ID" class="w-full bg-slate-950 border border-slate-800 rounded px-3 py-1.5 text-sm text-white font-mono">
                            <button onclick="fetchPlayerById()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-1.5 rounded text-xs font-medium border border-slate-700 transition">Fetch</button>
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Player Name</label>
                        <input type="text" id="player-name" placeholder="Full Name" class="w-full bg-slate-950 border border-slate-800 rounded px-3 py-1.5 text-sm text-white">
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Rating</label>
                        <input type="number" id="player-rating" value="1500" class="w-full bg-slate-950 border border-slate-800 rounded px-3 py-1.5 text-sm text-white font-mono">
                    </div>
                    <button onclick="addPlayer()" class="w-full bg-slate-800 hover:bg-slate-700 text-emerald-400 border border-slate-700 font-medium py-2 rounded text-xs tracking-wide uppercase transition">Add Player</button>
                </div>
            </div>

            <button onclick="initializeTournament()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3 rounded text-sm transition tracking-wide uppercase">
                Initialize Tournament
            </button>
        </div>

        <div class="lg:col-span-2 bg-slate-900 border border-slate-800 rounded-lg p-5 flex flex-col justify-between">
            <div>
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-sm font-semibold text-slate-300 uppercase tracking-wider">Registered Roster</h2>
                    <span id="roster-count" class="text-xs font-mono text-slate-500">0 players</span>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-xs font-mono">
                        <thead>
                        <tr class="border-b border-slate-800 text-slate-500 uppercase">
                            <th class="py-2.5 px-3">#</th>
                            <th class="py-2.5 px-3">Name</th>
                            <th class="py-2.5 px-3">Rating</th>
                            <th class="py-2.5 px-3 text-right">Action</th>
                        </tr>
                        </thead>
                        <tbody id="player-list-body" class="divide-y divide-slate-800/60 text-slate-300"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
